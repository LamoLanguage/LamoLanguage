[package]
name = "lamo-lsp"
version = "0.1.0"
edition = "2021"
description = "Language Server Protocol implementation for the Lamo programming language"
license = "MIT"
repository = "https://github.com/LamoLanguage/LamoLanguage"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
futures = "0.3"

[profile.release]
lto = true
strip = true

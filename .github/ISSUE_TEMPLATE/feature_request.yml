name: Feature request
description: Suggest an improvement to Lamo or its tools.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem this would solve and how you would expect the feature to work.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: Explain what is difficult or currently impossible.
      placeholder: I want to ... but currently ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you would like. Add a Lamo code example if useful.
      render: markdown
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches have you considered?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, use cases, or references that help explain the request.
    validations:
      required: false

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/icon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lamo — a modern programming language that transpiles to C. Docs, language guide, standard library and CLI reference." />
    <meta name="theme-color" content="#0a0714" />
    <title>Lamo — A modern language that transpiles to C</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Prevent FOUC: apply dark class immediately before render -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('lamo-theme');
          var isDark = theme === 'dark' || ((!theme || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-gray-900 antialiased dark:bg-[#0a0714] dark:text-gray-100 selection:bg-brand-500/20 selection:text-brand-900 dark:selection:text-brand-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
